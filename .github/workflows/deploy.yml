name: Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync sshpass

      - name: Check server password
        env:
          PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ -z "$PASS" ]; then
            echo "缺少 SERVER_PASSWORD Secret，请到仓库 Settings → Secrets 添加"
            exit 1
          fi

      - name: Sync files to server
        env:
          PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "$PASS" rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='backend/.venv/' \
            --exclude='frontend/node_modules/' \
            --exclude='backend/data/' \
            --exclude='data/' \
            --exclude='qoc-deploy.tar.gz' \
            --exclude='.DS_Store' \
            ./ root@139.196.232.73:/opt/qoc/

      - name: Start service
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: 139.196.232.73
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/qoc
            docker compose pull
            docker compose up -d
